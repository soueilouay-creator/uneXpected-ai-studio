services:
  - type: web
    name: unexpected-ai-studio
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: UNEXPECTED_ACCESS_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5-20250929
