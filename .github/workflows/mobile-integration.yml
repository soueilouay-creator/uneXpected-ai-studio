name: uneXpected Phone Integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'runtime-client.mjs'
      - 'test/runtime-client.test.mjs'
      - 'test/runtime-route-smoke.test.mjs'
      - 'Dockerfile'
      - 'mobile-release/**'
      - 'mobile-assets.mjs'
      - 'mobile-assets.parts/**'
      - 'source.tar.gz.b64'
      - 'test/mobile*.test.mjs'
      - 'test/indexeddb-fixture-roundtrip.test.mjs'
      - 'test/indexeddb-browser-roundtrip.test.mjs'
      - 'test/indexeddb-browser-fixture.html'
      - 'test/openrouter-ui.test.mjs'
      - 'test/orchestrator.test.mjs'
      - 'test/provider-fetch-stub.mjs'
      - 'test/phone-workspace-ui.test.mjs'
      - 'test/mobile-provider-results.test.mjs'
      - 'openrouter-ui.js'
      - 'README.md'
      - 'render.yaml'
      - 'docs/v8/**'
      - '.github/workflows/mobile-integration.yml'
  push:
    branches:
      - main
      - 'upgrade/v8-*'
    paths:
      - 'server.js'
      - 'runtime-client.mjs'
      - 'test/runtime-client.test.mjs'
      - 'test/runtime-route-smoke.test.mjs'
      - 'Dockerfile'
      - 'mobile-release/**'
      - 'mobile-assets.mjs'
      - 'mobile-assets.parts/**'
      - 'source.tar.gz.b64'
      - 'test/mobile*.test.mjs'
      - 'test/indexeddb-fixture-roundtrip.test.mjs'
      - 'test/indexeddb-browser-roundtrip.test.mjs'
      - 'test/indexeddb-browser-fixture.html'
      - 'test/orchestrator.test.mjs'
      - 'test/provider-fetch-stub.mjs'
      - 'test/phone-workspace-ui.test.mjs'
      - 'test/mobile-provider-results.test.mjs'
      - '.github/workflows/mobile-integration.yml'
      - 'docs/v8/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore the original static site and mobile app assets
        run: |
          set -euo pipefail
          echo '02d5451e5ad6c344450a7f16607b92a8967647a75ea8b8a8f56318fffb4d5ee5  source.tar.gz.b64' | sha256sum -c -
          mkdir -p /tmp/ue-source /tmp/ue-extracted
          base64 -d source.tar.gz.b64 > /tmp/ue-source/source.tar.gz
          tar -xzf /tmp/ue-source/source.tar.gz -C /tmp/ue-extracted
          cp -R /tmp/ue-extracted/uneXpected-ai-studio-v1.0.1/public ./public
          cp app.js public/app.js
          cat mobile-assets.parts/part-*.b64 > /tmp/mobile-assets.tar.gz.b64
          printf '%s  %s\n' 'd9316477b654ea04bc842a2f7ae158b2fffe3eab85f057d7bc3aa7a749f9f55e' /tmp/mobile-assets.tar.gz.b64 | sha256sum -c -
          base64 -d /tmp/mobile-assets.tar.gz.b64 | tar -xz -C .
          rm -f /tmp/mobile-assets.tar.gz.b64
          mkdir -p mobile
          cp -R mobile-release/. mobile/
          mkdir -p public
          rm -rf public/mobile
          cp -R mobile public/mobile
          test -f public/index.html
          test -f public/mobile/index.html
      - name: Syntax checks
        run: |
          node --check server.js
          node --check runtime-client.mjs
          node --check app.js
          node --check openrouter-ui.js
          node --check test/openrouter-ui.test.mjs
          node --check test/orchestrator.test.mjs
          node --check test/runtime-client.test.mjs
          node --check test/runtime-route-smoke.test.mjs
          node --check test/provider-fetch-stub.mjs
          node --check mobile-assets.mjs
          node --check mobile-release/app.js
          node --check mobile-release/providers.js
          node --check mobile-release/merge.js
          node --check test/mobile-provider-results.test.mjs
          node --check test/indexeddb-fixture-roundtrip.test.mjs
          node --check test/indexeddb-browser-roundtrip.test.mjs
          node --check test/phone-workspace-ui.test.mjs
      - name: Mobile and authenticated gateway HTTP tests
        run: node --test test/mobile-assets.test.mjs test/mobile-pwa.test.mjs test/mobile-route-smoke.test.mjs test/openrouter-ui.test.mjs test/orchestrator.test.mjs test/phone-workspace-ui.test.mjs test/mobile-provider-results.test.mjs test/indexeddb-fixture-roundtrip.test.mjs test/runtime-client.test.mjs test/runtime-route-smoke.test.mjs
      - name: Real Chromium IndexedDB backup and restore
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          CHROME_BIN="$CHROME_BIN" node --test test/indexeddb-browser-roundtrip.test.mjs
      - name: Build the production Docker image
        run: docker build --tag unexpected-ai-studio:openrouter-test .
