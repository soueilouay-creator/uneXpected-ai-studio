name: TAAFT integration checks

on:
  push:
    branches:
      - feature/taaft-readonly-mcp
      - 'upgrade/v8-*'
    paths:
      - 'server.js'
      - 'taaft-integration.mjs'
      - 'test/taaft-integration.test.mjs'
      - '.github/workflows/taaft-integration.yml'
      - 'docs/v8/**'
  pull_request:
    paths:
      - 'server.js'
      - 'taaft-integration.mjs'
      - 'test/taaft-integration.test.mjs'
      - '.github/workflows/taaft-integration.yml'
      - 'docs/v8/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check taaft-integration.mjs
          node --check test/taaft-integration.test.mjs
      - name: Run TAAFT integration tests
        run: node --test test/taaft-integration.test.mjs
